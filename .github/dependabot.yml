version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "10:43"
      timezone: "America/Chicago"
    open-pull-requests-limit: 2
    groups:
      routine-safe-updates:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
