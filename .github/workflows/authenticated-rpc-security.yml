name: WorkTeams Signed-In RPC Security

on:
  pull_request:
    paths:
      - 'supabase/051_authenticated_only_rpc_permissions.sql'
      - 'scripts/check-authenticated-rpc-grants.mjs'
      - '.github/workflows/authenticated-rpc-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/051_authenticated_only_rpc_permissions.sql'
      - 'scripts/check-authenticated-rpc-grants.mjs'
      - '.github/workflows/authenticated-rpc-security.yml'
permissions:
  contents: read
concurrency:
  group: workteams-authenticated-rpc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  auth-rpc-security:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/check-authenticated-rpc-grants.mjs
